#Minecraft server properties
#Optimizado para Forge 1.20.1 en GitHub Codespaces

# ── Conexión ─────────────────────────────────────
server-port=25565
online-mode=false
# Pon online-mode=true si todos tienen cuenta oficial

# ── Mundo ────────────────────────────────────────
level-name=world
level-seed=
gamemode=survival
difficulty=normal
max-players=10
spawn-protection=16
allow-nether=true
allow-flight=false

# ── Rendimiento ──────────────────────────────────
view-distance=8
simulation-distance=6
max-tick-time=60000
network-compression-threshold=256

# ── Jugabilidad ──────────────────────────────────
pvp=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
enable-command-block=true
force-gamemode=false
hardcore=false
max-world-size=29999984
max-build-height=320

# ── Whitelist / Op ───────────────────────────────
white-list=false
enforce-whitelist=false
op-permission-level=4

# ── Mensajes ─────────────────────────────────────
motd=\u00A76Servidor Forge 1.20.1 \u00A7r| \u00A7aOnline
enable-status=true

# ── Rcon (administración remota) ─────────────────
enable-rcon=false
rcon.port=25575
rcon.password=cambia_esta_password

# ── Otros ────────────────────────────────────────
enable-query=false
query.port=25565
snooper-enabled=false
